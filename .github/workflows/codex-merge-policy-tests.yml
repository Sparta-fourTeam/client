name: Codex merge policy tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test-merge-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out policy tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Run merge policy regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_codex_merge.py' -v
