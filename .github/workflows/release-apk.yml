name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-build
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Allocate shared Android version code
        id: version
        run: |
          python3 - <<'PY'
          import os, re, subprocess, time
          time.sleep(2)
          code = int(time.time()) - 1577836800
          tags = subprocess.check_output(['git', 'for-each-ref', 'refs/tags', '--format=%(contents)'], text=True)
          previous = [int(value) for value in re.findall(r'^Android-Version-Code: (\d+)$', tags, re.M)]
          if not 0 < code <= 2100000000 or code <= max(previous, default=0):
              raise SystemExit('Version code must exceed the published tag code and fit the Play range')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('code=' + str(code) + '\n')
          PY

      - name: Build Release APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: Android
          buildProfile: 'Assets/Settings/Build Profiles/Android_Release.asset'
          buildMethod: Game.Editor.CiBuild.Build
          androidExportType: androidPackage
          versioning: Tag
          androidVersionCode: ${{ steps.version.outputs.code }}
          buildsPath: build

          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGES.md
          generate_release_notes: false
          files: |
            build/Android/*.apk
          fail_on_unmatched_files: true
