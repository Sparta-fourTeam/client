name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-build
  cancel-in-progress: false

jobs:
  manual_scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require an existing version tag selected through the CLI
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$RELEASE_REPOSITORY" != 'Sparta-fourTeam/client' || "$RELEASE_REF" != refs/tags/v* ]]; then
            echo 'Release APK requires an existing ledger-matching tag. Use gh workflow run release-apk.yml --ref <existing-version-tag> --repo Sparta-fourTeam/client.'
            exit 1
          fi

  release:
    needs: manual_scope
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate shared Android release number
        id: version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 .github/scripts/android-release-version.py --version "$RELEASE_VERSION" --apk-build

      - name: Build Release APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: Android
          buildProfile: 'Assets/Settings/Build Profiles/Android_Release.asset'
          buildMethod: Game.Editor.CiBuild.Build
          androidExportType: androidPackage
          versioning: Custom
          version: ${{ steps.version.outputs.version_name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          buildsPath: build

          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGES.md
          generate_release_notes: false
          files: |
            build/Android/*.apk
          fail_on_unmatched_files: true
