name: Deploy Google Play Internal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: '고정 원본 code2 복구 전용 표시 버전'
        default: '1.0.2'
        type: string
        required: true
      publish_to_internal:
        description: '고정 원본 code2 복구 게시 승인 (새 출시는 태그 경로 사용)'
        type: boolean
        required: true
        default: false
      recover_original_code2:
        description: '빌드 없이 고정 원본 run38347195550 / artifact11789029713의 code2 복구'
        type: boolean
        required: true
        default: false
      acknowledge_edit_invalidation:
        description: '복구 edit 생성/commit이 기존 미커밋 edit을 무효화할 수 있음을 확인'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-release-build
  cancel-in-progress: false

jobs:
  tag_request:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate protected dev tag and safe pre-build retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/android-tag-build.py request
      - name: Run offline release control regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Preserve original tag request
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: tag-release-request
          path: build/tag-release-request.json
          if-no-files-found: error
          retention-days: 90

  prepare:
    needs: tag_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_sha: ${{ steps.release.outputs.build_sha }}
      version_name: ${{ steps.release.outputs.version_name }}
    steps:
      - name: Checkout exact immutable dev tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tag-release-request
          path: release-request
      - name: Validate exact tag source and configured required CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/android-tag-build.py prepare --request release-request/tag-release-request.json
      - name: Preserve exact build authorization
        uses: actions/upload-artifact@v4
        with:
          name: release-source-${{ github.run_attempt }}
          path: build/tag-release.json
          if-no-files-found: error
          retention-days: 90

  manual_scope:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.recover_original_code2 }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'New releases require a protected dev version tag. Manual dispatch is code2 recovery only.'
          exit 1

  build:
    needs: prepare
    permissions:
      contents: read
      actions: read
    env:
      BUILD_SHA: ${{ needs.prepare.outputs.build_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - name: Checkout exact protected dev tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-source-${{ github.run_attempt }}
          path: release-context

      - name: Validate release profile
        id: profile
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          profile = pathlib.Path('Assets/Settings/Build Profiles/Android_Release.asset')
          settings = profile.read_text()
          def field(name):
              match = re.search(r'\b' + name + r': ([^\n]+)', settings)
              if not match:
                  raise SystemExit('Required release field missing: ' + name)
              return match.group(1).rstrip("'").strip()
          package = re.search(r'Android: (com\.[A-Za-z0-9_.]+)', settings).group(1)
          version = os.environ['RELEASE_VERSION']
          target = int(field('AndroidTargetSdkVersion'))
          if package != 'com.teamdoodle.doodledefense':
              raise SystemExit('Release package does not match Play app')
          if not re.fullmatch(r'\d+(?:\.\d+){1,2}', version):
              raise SystemExit('Invalid release version')
          release_tag = 'v' + version
          if target < 36 or field('AndroidTargetArchitectures') != '2':
              raise SystemExit('API 36+ and ARM64 required')
          if field('m_Development') != '0' or field('m_BuildAppBundle') != '1':
              raise SystemExit('Non-development AAB required')
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/release-inputs.json').write_text(json.dumps({
              'source_commit': os.environ['BUILD_SHA'], 'package': package,
              'version_name': version, 'release_tag': release_tag, 'target_api': target,
              'profile_sha256': hashlib.sha256(profile.read_bytes()).hexdigest()
          }, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version_name=' + version + '\n')
          PY

      - name: Allocate automatic Android release number
        id: version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/android-release-version.py --automatic --release-request release-context/tag-release.json

      - name: Record candidate version code
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('build/release-inputs.json')
          data = json.loads(path.read_text())
          data.update(json.loads(pathlib.Path('build/tag-release.json').read_text()))
          data['version_code'] = int(os.environ['ANDROID_VERSION_CODE'])
          data['actions_run_id'] = int(os.environ['GITHUB_RUN_ID'])
          data['actions_run_number'] = int(os.environ['GITHUB_RUN_NUMBER'])
          data['actions_run_attempt'] = int(os.environ['GITHUB_RUN_ATTEMPT'])
          data['version_code_scheme'] = '3 + (run_number - 11); workflow_id=378016847'
          data['version_code_allocation'] = dict(scheme='workflow-run-offset-v1', workflowId=378016847, runNumber=data['actions_run_number'])
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Build signed Release AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: Android
          buildProfile: 'Assets/Settings/Build Profiles/Android_Release.asset'
          buildMethod: Game.Editor.CiBuild.Build
          androidExportType: androidAppBundle
          versioning: Custom
          version: ${{ steps.version.outputs.version_name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          buildsPath: build
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Validate actual AAB and record evidence
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          SIGNING_KEYALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' 2d4ad908faea64047c1cc9cb747e6aa667c6ab192e09607bd16b67246a8cd6ae \
            "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, struct, subprocess, tempfile, xml.etree.ElementTree as ET, zipfile
          files = list(pathlib.Path('build/Android').glob('*.aab'))
          if len(files) != 1:
              raise SystemExit('Exactly one AAB required')
          aab = files[0]
          tool = str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'bundletool.jar')
          def run(args):
              return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT)
          run(['java', '-jar', tool, 'validate', '--bundle=' + str(aab)])
          manifest = ET.fromstring(run(['java', '-jar', tool, 'dump', 'manifest', '--bundle=' + str(aab), '--module=base']))
          config = json.loads(run(['java', '-jar', tool, 'dump', 'config', '--bundle=' + str(aab)]))
          expected = json.loads(pathlib.Path('build/release-inputs.json').read_text())
          ns = '{http://schemas.android.com/apk/res/android}'
          actual = {'package': manifest.get('package'), 'version_name': manifest.get(ns + 'versionName'),
                    'version_code': int(manifest.get(ns + 'versionCode')),
                    'target_api': int(manifest.find('uses-sdk').get(ns + 'targetSdkVersion'))}
          if any(actual[key] != expected[key] for key in actual):
              raise SystemExit('AAB differs from release profile')
          if manifest.find('application').get(ns + 'debuggable', 'false') != 'false':
              raise SystemExit('Debuggable AAB rejected')
          abis, alignments = set(), {}
          with zipfile.ZipFile(aab) as archive:
              for name in archive.namelist():
                  if name.lower().endswith(('.keystore', '.jks', '.p12', '.pfx', '.env')):
                      raise SystemExit('Private signing/configuration file inside AAB')
                  if name.startswith('base/lib/') and name.endswith('.so'):
                      abis.add(name.split('/')[2])
                      data = archive.read(name)
                      if data[:4] != b'\x7fELF' or data[4] != 2:
                          raise SystemExit('Unexpected native binary format')
                      endian = '<' if data[5] == 1 else '>'
                      offset = struct.unpack_from(endian + 'Q', data, 32)[0]
                      size, count = struct.unpack_from(endian + 'HH', data, 54)
                      values = [struct.unpack_from(endian + 'Q', data, offset + i * size + 48)[0]
                                for i in range(count) if struct.unpack_from(endian + 'I', data, offset + i * size)[0] == 1]
                      if not values or any(value < 16384 for value in values):
                          raise SystemExit('Native library is not 16KB aligned')
                      alignments[name] = values
          if abis != {'arm64-v8a'} or config.get('optimizations', {}).get('uncompressNativeLibraries', {}).get('alignment') != 'PAGE_ALIGNMENT_16K':
              raise SystemExit('AAB architecture/alignment mismatch')
          signed = run(['jarsigner', '-J-Duser.language=en', '-J-Duser.country=US', '-verify', str(aab)])
          if 'jar verified.' not in signed or 'unsigned entries' in signed.lower():
              raise SystemExit('AAB signature verification failed')
          cert = run(['keytool', '-J-Duser.language=en', '-J-Duser.country=US', '-printcert', '-jarfile', str(aab)])
          fingerprints = re.findall(r'SHA256:\s*([A-F0-9:]+)', cert)
          with tempfile.NamedTemporaryFile(dir=os.environ['RUNNER_TEMP']) as store:
              store.write(base64.b64decode(''.join(os.environ.pop('SIGNING_KEYSTORE_BASE64').split()), validate=True))
              store.flush()
              configured = run(['keytool', '-J-Duser.language=en', '-J-Duser.country=US', '-list', '-v',
                  '-keystore', store.name, '-storepass:env', 'SIGNING_KEYSTORE_PASS', '-alias', os.environ['SIGNING_KEYALIAS']])
          if len(fingerprints) != 1 or fingerprints != re.findall(r'SHA256:\s*([A-F0-9:]+)', configured):
              raise SystemExit('AAB signer differs from configured upload key')
          evidence = dict(expected, **{'actual': actual, 'artifact': aab.name,
              'artifact_sha256': hashlib.sha256(aab.read_bytes()).hexdigest(),
              'signer_certificate_sha256': fingerprints,
              'architectures': sorted(abis), 'elf_load_alignments': alignments,
              'signature_verified': True,
              'permissions': [p.get(ns + 'name') for p in manifest.findall('uses-permission')]})
          pathlib.Path('build/artifact-manifest.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Save verified AAB and non-sensitive evidence
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB-${{ steps.version.outputs.code }}-${{ needs.prepare.outputs.build_sha }}
          path: |
            build/Android/*.aab
            build/release-inputs.json
            build/artifact-manifest.json
            build/tag-release.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, build]
    permissions:
      contents: read
      actions: read
    env:
      BUILD_SHA: ${{ needs.prepare.outputs.build_sha }}
    runs-on: ubuntu-latest
    # Reserve Play request timeouts plus setup and fresh GitHub preflights.
    timeout-minutes: 45
    steps:
      - name: Initialize minimal publish attempt before checkout
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          state = dict(source_commit=os.environ['BUILD_SHA'], actions_run=int(os.environ['GITHUB_RUN_ID']),
              version_name=os.environ['RELEASE_VERSION'], version_code=int(os.environ['ANDROID_VERSION_CODE']),
              track='internal', phase='job_started', artifact_verified=False)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'internal-publish-attempt.json').write_text(json.dumps(state, indent=2) + '\n')
          PY

      - name: Checkout source and current release ledger
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-source-${{ github.run_attempt }}
          path: release-context

      - name: Download this run's verified AAB
        uses: actions/download-artifact@v4
        with:
          name: Release-AAB-${{ needs.build.outputs.version_code }}-${{ needs.prepare.outputs.build_sha }}
          path: verified

      - name: Recheck artifact identity
        id: artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          evidence = json.loads(pathlib.Path('verified/artifact-manifest.json').read_text())
          release = json.loads(pathlib.Path('release-context/tag-release.json').read_text())
          if any(evidence.get(key) != value for key, value in release.items()):
              raise SystemExit('Artifact tag/source provenance mismatch')
          files = list(pathlib.Path('verified/Android').glob('*.aab'))
          if len(files) != 1 or evidence['source_commit'] != os.environ['BUILD_SHA']:
              raise SystemExit('Artifact source mismatch')
          if evidence['actual']['package'] != 'com.teamdoodle.doodledefense' or not evidence['signature_verified']:
              raise SystemExit('Artifact package/signature mismatch')
          if hashlib.sha256(files[0].read_bytes()).hexdigest() != evidence['artifact_sha256']:
              raise SystemExit('Artifact hash mismatch')
          actual = evidence['actual']
          if actual['version_name'] != os.environ['RELEASE_VERSION'] or actual['version_code'] != int(os.environ['ANDROID_VERSION_CODE']):
              raise SystemExit('Artifact version mismatch')
          release_name = f"{actual['version_name']}({actual['version_code']})"
          if len(release_name) > 50:
              raise SystemExit('Play release name exceeds 50 characters')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('release_name=' + release_name + '\n')
          PY

      - name: Prepare verified artifact receipt before revalidation
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: python3 .github/scripts/publish-play-internal.py --prepare

      - name: Revalidate the protected tag source and its original code
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ needs.build.outputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/android-release-version.py --automatic --release-request release-context/tag-release.json --expected-code "$ANDROID_VERSION_CODE"

      - name: Install existing Play API dependencies
        run: python3 -m pip install google-auth==2.40.3 requests==2.32.4

      - name: Publish the tag-authorized internal test release
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ needs.build.outputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-play-internal.py

      - name: Preserve minimal upload receipt including uncertain failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Internal-upload-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/internal-publish-attempt.json
            build/internal-upload-receipt.json
          if-no-files-found: warn
          retention-days: 90

  recover_code2:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_original_code2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check explicit scope and acknowledgment
        env:
          CONFIRM_INTERNAL_CODE2: ${{ inputs.publish_to_internal && inputs.release_version == '1.0.2' }}
          ACKNOWLEDGE_EDIT_INVALIDATION: ${{ inputs.acknowledge_edit_invalidation }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('recovery', '.github/scripts/recover-play-code2.py')
          recovery = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(recovery)
          recovery.check_execution(os.environ)
          PY

      - name: Run offline recovery regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_recover_play_code2.py -v

      - name: Download only the fixed original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Sparta-fourTeam/client/actions/artifacts/11789029713 > "$RUNNER_TEMP/recovery-artifact.json"
          gh api repos/Sparta-fourTeam/client/actions/artifacts/11789029713/zip > "$RUNNER_TEMP/original-aab.zip"

      - name: Verify archive digest and original AAB separately
        run: |
          python3 .github/scripts/recover-play-code2.py verify \
            --archive "$RUNNER_TEMP/original-aab.zip" --metadata "$RUNNER_TEMP/recovery-artifact.json" \
            --destination "$RUNNER_TEMP/code2-recovery"

      - name: Install pinned Play authentication transport
        run: python3 -m pip install 'google-auth==2.40.3' 'requests==2.32.5'

      - name: Reuse or upload original code2 and commit internal only
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          CONFIRM_INTERNAL_CODE2: ${{ inputs.publish_to_internal && inputs.release_version == '1.0.2' }}
          ACKNOWLEDGE_EDIT_INVALIDATION: ${{ inputs.acknowledge_edit_invalidation }}
        run: |
          python3 .github/scripts/recover-play-code2.py publish \
            --archive "$RUNNER_TEMP/original-aab.zip" --metadata "$RUNNER_TEMP/recovery-artifact.json" \
            --destination "$RUNNER_TEMP/code2-recovery"

      - name: Preserve non-sensitive edit receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: code2-recovery-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/code2-recovery/recovery-receipt.json
          if-no-files-found: ignore
          retention-days: 7
