<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>몬스터 엘리트 비교</title>
<style>
:root{--size:128px;--preview:#252833;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:28px;font-family:system-ui,sans-serif;background:#15171e;color:#e8edf6}h1{font-size:24px;margin:0 0 8px}header p{color:#a5b0c1}nav{display:flex;gap:18px;flex-wrap:wrap;margin:22px 0}label{display:flex;gap:8px;align-items:center}select{padding:6px 12px;background:#2a3040;color:#fff;border:1px solid #586174;border-radius:6px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,calc(var(--size)*2 + 64px)),1fr));gap:20px}article{border:1px solid #3b4354;border-radius:12px;padding:18px;background:#1c202a}h2{font-size:18px;margin:0}article p{font-size:13px;color:#a5b0c1;margin:8px 0 18px}.pair{display:flex;justify-content:center;gap:12px;align-items:flex-start}figure{margin:0;text-align:center}a{display:block;background:var(--preview);border-radius:8px}img{display:block;width:var(--size);height:var(--size);object-fit:contain}figcaption{margin-top:9px;font-size:13px;color:#bec8d9}.checker a{background-color:#d6d6d6;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
</style><header><h1>몬스터 엘리트 비교</h1><p>원본과 엘리트를 같은 표시 크기로 비교합니다. 그림을 누르면 PNG 원본을 엽니다.</p></header>
<nav><label>표시 크기 <select id="size"><option value="64">64 px</option><option value="128" selected>128 px</option><option value="256">256 px</option></select></label><label>배경 <select id="background"><option value="dark">어두운 배경</option><option value="light">밝은 배경</option><option value="checker">투명도 격자</option></select></label></nav>
<main class="cards"><article><h2>슬라임</h2><p>짙은 녹색, 돌기와 송곳니</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/Slime.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/Slime.png" alt="슬라임 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/SlimeElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/SlimeElite.png" alt="슬라임 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article>
<article><h2>골렘</h2><p>두꺼운 돌 갑주와 금빛 균열</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/Golem.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/Golem.png" alt="골렘 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/GolemElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/GolemElite.png" alt="골렘 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article>
<article><h2>BrainSpider</h2><p>보랏빛 뇌와 다리 가시</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/BrainSpider.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/BrainSpider.png" alt="BrainSpider 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/BrainSpiderElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/BrainSpiderElite.png" alt="BrainSpider 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article>
<article><h2>ArmoredCrab</h2><p>겹껍질과 짙은 푸른 얼굴판</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/ArmoredCrab.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/ArmoredCrab.png" alt="ArmoredCrab 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/ArmoredCrabElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/ArmoredCrabElite.png" alt="ArmoredCrab 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article>
<article><h2>박쥐</h2><p>붉은 날개막과 송곳니</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/Bat.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/Bat.png" alt="박쥐 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/BatElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/BatElite.png" alt="박쥐 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article>
<article><h2>EyeJelly</h2><p>보라색 고리와 갈고리 촉수</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/EyeJelly.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/EyeJelly.png" alt="EyeJelly 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/EyeJellyElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/EyeJellyElite.png" alt="EyeJelly 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article>
<article><h2>유령</h2><p>갈고리 팔 끝과 찢긴 꼬리</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/Ghost.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/Ghost.png" alt="유령 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/GhostElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/GhostElite.png" alt="유령 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article>
<article><h2>오니</h2><p>큰 외뿔과 두꺼운 팔</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/Oni.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/Oni.png" alt="오니 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/OniElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/OniElite.png" alt="오니 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article>
<article><h2>해골</h2><p>두꺼운 뼈와 뼈 돌기</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/Skeleton.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/Skeleton.png" alt="해골 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/SkeletonElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/SkeletonElite.png" alt="해골 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article>
<article><h2>거미</h2><p>진홍색 몸통과 다리 가시</p><div class="pair"><figure><a href="../../Assets/_Project/Sprites/Generated/Monsters/Spider.png"><img loading="lazy" src="../../Assets/_Project/Sprites/Generated/Monsters/Spider.png" alt="거미 원본"></a><figcaption>원본</figcaption></figure><figure><a href="../../Assets/_Project/Sprites/SpiderElite.png"><img loading="lazy" src="../../Assets/_Project/Sprites/SpiderElite.png" alt="거미 엘리트"></a><figcaption>엘리트</figcaption></figure></div></article></main>
<script>document.getElementById("size").addEventListener("change",e=>document.documentElement.style.setProperty("--size",e.target.value+"px"));document.getElementById("background").addEventListener("change",e=>{document.body.classList.toggle("checker",e.target.value==="checker");document.documentElement.style.setProperty("--preview",e.target.value==="light"?"#f0f1f5":"#252833")});</script></html>
