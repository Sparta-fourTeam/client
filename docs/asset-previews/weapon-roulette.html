<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8칸 무기 룰렛</title>
<style>body{margin:0;padding:28px;background:#1c2029;color:#e9eef8;font-family:system-ui,sans-serif;text-align:center}h1{font-size:22px}p{color:#b5c0d0}.wheel{position:relative;width:min(600px,88vw);aspect-ratio:1;margin:24px auto}.wheel img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.needle{transform-origin:50% 50%;animation:turn 8s linear infinite}@keyframes turn{from{transform:rotate(22.5deg)}to{transform:rotate(382.5deg)}}button{background:#dfb977;border:0;padding:10px 20px;border-radius:8px;color:#222;font-weight:600;cursor:pointer}label{margin-left:16px}a{color:#eed099}input{width:200px;vertical-align:middle}</style>
<h1>8칸 무기 룰렛</h1><p>빈 회전판과 중앙 바늘을 별도 PNG로 구성했습니다.</p>
<button id="toggle">일시정지</button><label>각도 <input id="angle" aria-label="바늘 각도" type="range" min="0" max="360" value="22.5" step="0.5"></label>
<div class="wheel"><img src="../../Assets/_Project/Sprites/WeaponRouletteWheel.png" alt="아이콘이 없는 8칸 룰렛"><img class="needle" id="needle" src="../../Assets/_Project/Sprites/WeaponRouletteSpinner.png" alt="중앙 회전 바늘"></div>
<p><a href="../../Assets/_Project/Sprites/WeaponRouletteWheel.png">룰렛 PNG</a> · <a href="../../Assets/_Project/Sprites/WeaponRouletteSpinner.png">회전 바늘 PNG</a></p>
<script>const needle=document.getElementById("needle"),toggle=document.getElementById("toggle");let running=true;toggle.onclick=()=>{if(needle.style.animation==="none"){needle.style.animation="";running=true}else{running=!running}needle.style.animationPlayState=running?"running":"paused";toggle.textContent=running?"일시정지":"회전 시작"};document.getElementById("angle").oninput=e=>{needle.style.animation="none";needle.style.transform="rotate("+e.target.value+"deg)";running=false;toggle.textContent="회전 시작"};</script></html>
